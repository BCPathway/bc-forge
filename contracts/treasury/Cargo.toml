[package]
name = "bc-forge-treasury"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "22.0.11"
bc-forge-admin = { path = "../admin" }

[dev-dependencies]
soroban-sdk = { version = "22.0.11", features = ["testutils"] }
bc-forge-token = { path = "../token", features = ["testutils"] }

[features]
testutils = ["soroban-sdk/testutils"]
