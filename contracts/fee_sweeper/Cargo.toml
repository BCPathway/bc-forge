[package]
name = "bc-forge-fee-sweeper"
version = "0.1.0"
edition = "2021"
publish = false
description = "Keeper contract that sweeps accumulated token fees into the treasury and yield vault"
repository = "https://github.com/BCPathway/bc-forge"
license = "MIT"
keywords = ["soroban", "stellar", "smart-contract", "fees", "treasury", "keeper"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = "29.0.1"

[dev-dependencies]
soroban-sdk = { version = "29.0.1", features = ["testutils"] }
bc-forge-token = { path = "../token", features = ["testutils"] }
bc-forge-admin = { path = "../admin" }

[features]
testutils = ["soroban-sdk/testutils"]
