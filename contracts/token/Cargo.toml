[package]
name = "bc-forge-token"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
authors.workspace = true
categories.workspace = true
keywords.workspace = true
rust-version.workspace = true
description = "Core SEP-41 token contract for bc-forge with admin controls and pausable lifecycle"
readme = "../../README.md"
publish = false
repository = "https://github.com/BCPathway/bc-forge"
license = "MIT"
keywords = ["soroban", "stellar", "smart-contract", "token", "sep-41"]
categories = ["cryptography::cryptocurrencies"]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
bc-forge-admin = { path = "../admin" }
bc-forge-lifecycle = { path = "../lifecycle" }

[dev-dependencies]
soroban-sdk = { version = "22.0.0", features = ["testutils"] }
proptest = "1.4.0"

[features]
testutils = ["soroban-sdk/testutils"]