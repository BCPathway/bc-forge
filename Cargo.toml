[workspace]
members = ["contracts/*"]
resolver = "2"

version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Peolite001/bc-forge"
homepage = "https://github.com/Peolite001/bc-forge"
documentation = "https://github.com/Peolite001/bc-forge#readme"
authors = ["bc-forge Contributors"]
categories = ["wasm", "cryptography::cryptocurrencies"]
keywords = ["soroban", "stellar", "smart-contracts", "token", "sep-41"]
rust-version = "1.74"
soroban-sdk = "22.0.0"
members = [

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
