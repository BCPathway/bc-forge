[workspace]
resolver = "2"

members = [
    "contracts/*",
    "e2e"
]
# `contracts/yield_vault` remains excluded from the workspace (see README);
# `contracts/compound_fees` was removed and `contracts/flash_loan_guard` is
# now part of the workspace (#923).
exclude = [
    "contracts/yield_vault",
]
default-members = ["contracts/*"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
