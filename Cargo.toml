[workspace]
resolver = "2"

members = [
    "contracts/*",
    "e2e"
]
# Incomplete crates landed on main without manifests; keep them out of CI.
exclude = [
    "contracts/compound_fees",
    "contracts/flash_loan_guard",
    "contracts/yield_vault",
]
default-members = ["contracts/*"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = false
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
