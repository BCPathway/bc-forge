# cargo-deny 0.20 configuration for bc-forge (#958).
# See https://github.com/EmbarkStudios/cargo-deny/pull/611 for the v2 schema.

[advisories]
version = 2
yanked = "warn"
# Transitive through soroban-sdk 22; not replaceable without a Soroban upgrade.
# Vulnerability advisories are still denied.
ignore = [
    "RUSTSEC-2024-0388", # derivative is unmaintained
    "RUSTSEC-2024-0436", # paste is unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "Unicode-3.0",
    "CC0-1.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
