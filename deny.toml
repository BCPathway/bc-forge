# cargo-deny 0.20 configuration for bc-forge (#958, #884).
# See https://github.com/EmbarkStudios/cargo-deny/pull/611 for the v2 schema.

[advisories]
version = 2
yanked = "warn"
# Transitive through soroban-sdk 22; not replaceable without a Soroban upgrade.
# Vulnerability advisories are still denied.
ignore = [
    "RUSTSEC-2024-0388", # derivative is unmaintained
    "RUSTSEC-2024-0436", # paste is unmaintained
]

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    # wasmparser and wasmparser-nostd, pulled in by soroban-sdk 22.
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
# Cargo.lock resolves every crate from crates.io. Unknown registries and git
# sources fail the check so a pull request cannot introduce one silently.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
