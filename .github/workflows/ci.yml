name: bc-forge CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  # ─── Smart Contract CI ───────────────────────────────────────────────────
  contracts:
    name: Smart Contracts (Rust)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bc-forge-contracts

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy lints
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --all

      - name: Check for circular crate dependencies (#770)
        run: python3 scripts/check_crate_cycles.py

      - name: Run multi-sig tests
        if: github.event_name == 'pull_request'
        run: cargo test -p bc-forge-admin
      - name: Install Tarpaulin
        run: cargo install cargo-tarpaulin --locked

      - name: Run coverage (Tarpaulin)
        run: cargo tarpaulin --workspace --out Html --out Xml --out Stdout
        continue-on-error: true

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: ./tarpaulin-report.html

      - name: Build WASM
        env:
          CARGO_INCREMENTAL: 0
        run: cargo build --workspace --exclude bc-forge-e2e-tests --target wasm32-unknown-unknown --release

      - name: Check WASM size budgets (#956)
        run: python3 scripts/check_wasm_size.py

  # ─── TypeScript SDK CI ──────────────────────────────────────────────────
  sdk:
    name: TypeScript SDK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ─── SDK Bindings Staleness Check (#926) ─────────────────────────────────
  # Ensures the committed generated bindings match a fresh run of
  # `stellar contract bindings typescript` against the latest WASM.
  sdk-bindings:
    name: SDK Bindings Staleness
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0
          targets: wasm32-unknown-unknown

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bc-forge-contracts

      - name: Install Stellar CLI
        run: cargo install stellar-cli --locked || cargo install soroban-cli --locked

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Install SDK dependencies
        run: npm ci
        working-directory: sdk

      - name: Generate bindings from fresh WASM
        run: bash scripts/generate-sdk-bindings.sh

      - name: Fail if committed bindings are stale
        run: |
          if ! git diff --exit-code sdk/src/generated/; then
            echo "::error::SDK bindings are stale. Run 'npm run generate:bindings' in sdk/ and commit the result."
            exit 1
          fi

  # ─── Indexer CI ─────────────────────────────────────────────────────────
  indexer:
    name: Indexer
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: indexer/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

  # ─── TypeScript CLI CI ──────────────────────────────────────────────────
  cli:
    name: TypeScript CLI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cli
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm test

  # ─── React Package CI (#896) ────────────────────────────────────────────
  # @bc-forge/react wraps @bc-forge/sdk, so the workspace SDK is built first
  # to provide the type declarations the react build consumes.
  react:
    name: React Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: react/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build SDK dependency
        run: npm run build --workspace @bc-forge/sdk

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

  # ─── Dependency audit (#770) ────────────────────────────────────────────
  # Verifies the workspace dependency graph resolves cleanly: cargo metadata
  # fails on manifest cycles or malformed feature declarations, and `cargo
  # tree --workspace --all-features` proves every member's graph resolves
  # with all feature combinations enabled (feature isolation) without
  # needing a full build.
  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.96.0

      - name: Setup Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: bc-forge-dep-audit

      - name: Resolve workspace metadata (rejects cycles / bad features)
        run: cargo metadata --no-deps --format-version 1 >/dev/null

      - name: Resolve full dependency graph with all features
        run: cargo tree --workspace --all-features >/dev/null

  # ─── Documentation link check (#348) ─────────────────────────────────────
  docs-links:
    name: Documentation Links
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Reject stale repository links in docs
        run: python3 scripts/check_doc_links.py
