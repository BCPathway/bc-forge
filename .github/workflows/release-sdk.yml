name: Release and Publish SDK

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (patch, minor, major)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major

jobs:
  release:
    name: Tag & Publish SDK
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: sdk/package-lock.json

      - name: Configure Git
        run: |
          git config --global user.name "EDOHWARES"
          git config --global user.email "edohwares@users.noreply.github.com"

      - name: Install dependencies
        working-directory: sdk
        run: npm ci

      - name: Bump Version
        id: version_bump
        working-directory: sdk
        run: |
          # Bump package.json version, but do not create git tag automatically via npm version
          NEW_VERSION=$(npm version ${{ github.event.inputs.version_bump }} --no-git-tag-version)
          echo "version=${NEW_VERSION}" >> $GITHUB_OUTPUT
          echo "New version: ${NEW_VERSION}"

      - name: Build
        working-directory: sdk
        run: npm run build

      - name: Run Tests
        working-directory: sdk
        run: npm test

      - name: Commit and Push Version Bump
        run: |
          git add sdk/package.json
          git commit -m "chore(release): bump sdk version to ${{ steps.version_bump.outputs.version }}"
          git push origin HEAD

      - name: Create and Push Git Tag
        run: |
          TAG_NAME="sdk-${{ steps.version_bump.outputs.version }}"
          git tag $TAG_NAME
          git push origin $TAG_NAME

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "sdk-${{ steps.version_bump.outputs.version }}"
          name: "SDK Release ${{ steps.version_bump.outputs.version }}"
          body: |
            Automated release of `@bc-forge/sdk` version `${{ steps.version_bump.outputs.version }}`.
            
            See commit history for detailed changes.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: sdk
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
