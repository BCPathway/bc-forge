name: Verify React release

# Post-publish verification for @bc-forge/react (#1046).
#
# `release.yml` calls this workflow after Changesets publishes, because a
# successful `npm publish` does not prove that the registry artifact is
# installable, that its `main`/`module` entries load, or that its declarations
# resolve. The check runs in a throwaway project that installs the exact
# published version from npm, imports it, renders a component with
# `react-dom/server`, and type-checks a consumer component.
#
# A failure here fails the release verification job. It never unpublishes: the
# version stays on npm and the fix ships as a new version.
#
# It can also be dispatched by hand to re-verify a release that already shipped.

on:
  workflow_call:
    inputs:
      version:
        description: "Exact @bc-forge/react version that was published"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "Exact version to verify (blank verifies the latest published version)"
        required: false
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: Verify ${{ inputs.version || 'latest' }} from a clean install
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Install, import, render, and type-check the published version
        env:
          PUBLISHED_VERSION: ${{ inputs.version }}
        run: node scripts/verify-published-react.mjs --version "$PUBLISHED_VERSION"
