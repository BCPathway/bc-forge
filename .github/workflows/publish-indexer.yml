name: Publish Indexer Image

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test indexer
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci --workspace=sdk --workspace=indexer --include-workspace-root=false

      - name: Build SDK
        run: npm run build --workspace=sdk

      - name: Generate Prisma client
        run: npm run prisma:generate --workspace=indexer

      - name: Build indexer
        run: npm run build --workspace=indexer

      - name: Run indexer tests
        run: npm test --workspace=indexer

  publish:
    name: Build and push indexer image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.name }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/indexer" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image tags and labels
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          tags: type=ref,event=tag

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: indexer/Dockerfile
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          labels: ${{ steps.metadata.outputs.labels }}

  sbom:
    name: Generate, publish, and attest image SBOM
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      packages: write
    steps:
      - name: Install Trivy
        uses: aquasecurity/setup-trivy@v0.2.6
        with:
          version: v0.69.3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate CycloneDX SBOM from image digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SBOM_FILE: ${{ runner.temp }}/indexer-${{ github.ref_name }}-sbom.cdx.json
        run: |
          umask 077
          trivy image --format cyclonedx --output "$SBOM_FILE" "${IMAGE}@${DIGEST}"

      - name: Validate SBOM content and secret exclusion
        env:
          SBOM_FILE: ${{ runner.temp }}/indexer-${{ github.ref_name }}-sbom.cdx.json
        run: |
          node --input-type=commonjs - "$SBOM_FILE" <<'NODE'
          const fs = require('node:fs');
          const file = process.argv[2];
          const text = fs.readFileSync(file, 'utf8');
          const bom = JSON.parse(text);

          if (bom.bomFormat !== 'CycloneDX' || !Array.isArray(bom.components) || bom.components.length === 0) {
            throw new Error('Expected a non-empty CycloneDX SBOM');
          }

          const purls = bom.components.map((component) => component.purl || '');
          const npmCount = purls.filter((purl) => purl.startsWith('pkg:npm/')).length;
          const osCount = bom.components.filter((component) => {
            const purl = component.purl || '';
            return component.type === 'operating-system'
              || purl.startsWith('pkg:apk/')
              || purl.startsWith('pkg:deb/')
              || purl.startsWith('pkg:rpm/')
              || purl.startsWith('pkg:alpm/');
          }).length;
          if (npmCount === 0 || osCount === 0) {
            throw new Error(`SBOM must contain OS and npm packages (os=${osCount}, npm=${npmCount})`);
          }

          const properties = [bom.metadata, ...bom.components]
            .flatMap((item) => item?.properties ?? []);
          if (properties.some((property) => /(?:^|[.:/])(?:env|environment)(?:[.:/]|$)/i.test(property.name ?? ''))) {
            throw new Error('SBOM contains environment-variable metadata');
          }

          const sensitiveValues = Object.entries(process.env)
            .filter(([name, value]) => /token|password|secret|credential|private.?key/i.test(name) && value)
            .map(([, value]) => value);
          const credentialPattern = /-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----|\b(?:gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|AKIA[0-9A-Z]{16})\b/;
          if (sensitiveValues.some((value) => text.includes(value)) || credentialPattern.test(text)) {
            throw new Error('SBOM contains a credential-like value');
          }

          console.log(`Validated CycloneDX SBOM with ${bom.components.length} components (${osCount} OS, ${npmCount} npm); no environment metadata or credential values found.`);
          NODE

      - name: Attach SBOM to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SBOM_FILE: ${{ runner.temp }}/indexer-${{ github.ref_name }}-sbom.cdx.json
        run: gh release upload "$GITHUB_REF_NAME" "$SBOM_FILE" --repo "$GITHUB_REPOSITORY" --clobber

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3.8.2

      - name: Attest SBOM to image digest
        env:
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          SBOM_FILE: ${{ runner.temp }}/indexer-${{ github.ref_name }}-sbom.cdx.json
        run: cosign attest --yes --type cyclonedx --predicate "$SBOM_FILE" "${IMAGE}@${DIGEST}"