# SPDX-License-Identifier: MIT
# Regenerates package-lock.json on Linux and commits it to the branch.
#
# `npm install` resolves optional and peer dependencies for the *current*
# platform, so a lockfile generated on Windows can omit entries that `npm ci` on
# a Linux runner then reports as missing. Regenerating here keeps the committed
# lockfile consistent with the platform CI actually installs on.
#
# `workflow_dispatch` only; it never runs on pull requests.
name: Update lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-lockfile-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      # `--package-lock-only` resolves the graph and rewrites the lockfile
      # without materialising node_modules.
      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile
        run: |
          set -euo pipefail
          if git diff --quiet -- package-lock.json; then
            echo "Lockfile already in sync."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore: regenerate package-lock.json on Linux'
          git push origin "HEAD:${{ github.ref_name }}"