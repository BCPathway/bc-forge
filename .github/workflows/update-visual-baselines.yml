# SPDX-License-Identifier: MIT
# Regenerates the committed Playwright visual baselines for this branch.
#
# `react/visual/stories.spec.ts` compares every built Storybook story against a
# zero-tolerance PNG baseline (`maxDiffPixels: 0`, `threshold: 0`) and
# `updateSnapshots` is pinned to `'none'`, so any new story without a baseline
# fails `npm run test:visual`. Those PNGs are only reproducible on the
# `ubuntu-24.04-arm` runner inside the pinned Playwright container — the same
# image the `React visual snapshots` workflow uses — because a screenshot taken
# on another platform or browser build renders text and antialiasing
# differently and would not match pixel-for-pixel.
#
# This workflow exists so that step can be performed without hand-rolling a
# container. It is `workflow_dispatch` only: it never runs on pull requests, and
# the regular visual workflow remains the gate.
name: Update visual baselines

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-visual-baselines-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    # Must match the `React visual snapshots` workflow, otherwise the PNGs it
    # produces would not be the ones that job compares against.
    runs-on: ubuntu-24.04-arm
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.17.1'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build SDK dependency
        run: npm run build --workspace @bc-forge/sdk

      # `test:visual:update` is `build-storybook` followed by
      # `playwright test --update-snapshots=all`, so new stories get a baseline
      # and genuinely changed stories are re-recorded rather than silently
      # rubber-stamped.
      - name: Regenerate baselines
        run: npm run test:visual:update --workspace @bc-forge/react

      - name: Commit regenerated baselines
        run: |
          set -euo pipefail
          if git diff --quiet -- react/visual/__screenshots__; then
            echo "No baseline changes to commit."
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add react/visual/__screenshots__
          git commit -m 'chore(react): regenerate visual baselines'
          git push origin "HEAD:${{ github.ref_name }}"