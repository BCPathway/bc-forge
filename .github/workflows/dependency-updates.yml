name: Automated Dependency Updates

on:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight
  workflow_dispatch:

jobs:
  update-dependencies:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Update Cargo dependencies
        run: |
          cargo update

      - name: Update NPM dependencies
        run: |
          for dir in sdk cli react indexer; do
            if [ -d "$dir" ]; then
              echo "Updating NPM dependencies in $dir..."
              cd $dir
              npm update
              cd ..
            fi
          done

      - name: Create Pull Request for updates
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore(deps): update cargo and npm dependencies"
          title: "chore(deps): automated dependency updates"
          body: |
            Automated dependency updates for Rust (Cargo) and NPM packages.
            
            This PR was automatically created by the `dependency-updates.yml` workflow.
          branch: "chore/dependency-updates"
          base: "main"
          labels: "dependencies"
